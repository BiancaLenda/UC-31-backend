{% extends "base.html" %}
{% block titulo %}Cadastrar Livro{% endblock %}
{% block conteudo %}
<h1>Cadastrar Livro</h1>

<form method="POST" action="{{ url_for('index') }}">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" placeholder="Ex: Dom Casmurro">

    <label for="autor">Autor</label>
    <input type="text" id="autor" name="autor" placeholder="Ex: Machado de Assis">

    <label for="ano">Ano de publicação</label>
    <input type="text" id="ano" name="ano" placeholder="Ex: 1899">

    <label for="categoria">Categoria</label>
    <input type="text" id="categoria" name="categoria" placeholder="Ex: Romance">

    <label for="quantidade">Quantidade de exemplares</label>
    <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 5">

    <button type="submit">Cadastrar Livro</button>
</form>
{% endblock %}
