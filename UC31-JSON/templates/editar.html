{% extends "base.html" %}
{% block titulo %}Editar Livro{% endblock %}
{% block conteudo %}
<h1>Editar Livro</h1>

<form method="POST" action="{{ url_for('editar_livro', indice=indice) }}">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" value="{{ livro.titulo }}">

    <label for="autor">Autor</label>
    <input type="text" id="autor" name="autor" value="{{ livro.autor }}">

    <label for="ano">Ano de publicação</label>
    <input type="text" id="ano" name="ano" value="{{ livro.ano }}">

    <label for="categoria">Categoria</label>
    <input type="text" id="categoria" name="categoria" value="{{ livro.categoria }}">

    <label for="quantidade">Quantidade de exemplares</label>
    <input type="number" id="quantidade" name="quantidade" value="{{ livro.quantidade }}">

    <button type="submit">Salvar Alterações</button>
</form>
{% endblock %}
